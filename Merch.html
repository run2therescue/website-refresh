<script type="text/babel">
/* Live storefront, powered by Fourthwall via the /api/products proxy
   (mirrors how Adopt/Sponsor pull live dogs from /api/animals).
   While every product is still a draft the API returns an empty list and the
   page shows the "coming soon" state; publishing products in Fourthwall makes
   the grid appear automatically. Buying links out to Fourthwall in a new tab,
   the same convention as donations (no embedded payment forms). */
/* Team-only preview: /merch?preview=1 renders the grid with sample products
   so the layout can be reviewed before anything is published in Fourthwall.
   Normal visitors never see it, and the samples link to the real shop. */
const IS_PREVIEW = new URLSearchParams(window.location.search).has("preview");
const SHOP_HOME = "https://run2therescue-yeh-shop.fourthwall.com";
function svgTile(label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e0f4"/><stop offset="1" stop-color="#f3f0fb"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/><text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#8b5cf6" letter-spacing="6">${label}</text><text x="300" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#6d5a8e" letter-spacing="3">SAMPLE PRODUCT</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
const PREVIEW_PRODUCTS = [
  { id: "pv1", name: "RUN. RESCUE. REPEAT. Tee", price: "$28+", image: svgTile("TEE"), soldOut: false, sizes: ["S","M","L","XL","2XL"], url: SHOP_HOME },
  { id: "pv2", name: "Second Chance Hoodie", price: "$52+", image: svgTile("HOODIE"), soldOut: false, sizes: ["S","M","L","XL"], url: SHOP_HOME },
  { id: "pv3", name: "Beacon of Hope Tote", price: "$22", image: svgTile("TOTE"), soldOut: false, sizes: [], url: SHOP_HOME },
  { id: "pv4", name: "Survivor Paw Mug", price: "$18", image: svgTile("MUG"), soldOut: true, sizes: [], url: SHOP_HOME },
];

function useProducts() {
  const [state, setState] = useStateS({ loading: true, products: [], shopUrl: null });
  useEffectS(() => {
    if (IS_PREVIEW) {
      setState({ loading: false, products: PREVIEW_PRODUCTS, shopUrl: SHOP_HOME });
      return;
    }
    let alive = true;
    fetch("/api/products")
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
      .then((data) => { if (alive) setState({ loading: false, products: data.products || [], shopUrl: data.shopUrl || null }); })
      .catch(() => { if (alive) setState({ loading: false, products: [], shopUrl: null }); });
    return () => { alive = false; };
  }, []);
  return state;
}

function ProductCard({ p }) {
  return (
    <a href={p.url} target="_blank" rel="noopener noreferrer"
      style={{ display: "block", background: "#fff", borderRadius: 16, overflow: "hidden", border: "1px solid var(--lav-200)", transition: "transform .2s ease, box-shadow .2s ease" }}
      onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-4px)"; e.currentTarget.style.boxShadow = "var(--shadow)"; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = "none"; e.currentTarget.style.boxShadow = "none"; }}
    >
      <div style={{ aspectRatio: "1/1", overflow: "hidden", background: "var(--lav-100)", position: "relative" }}>
        {p.image
          ? <img src={p.image} alt={p.name} loading="lazy" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
          : <div aria-hidden="true" style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(160deg, var(--lav-200), var(--lav-100))" }}>
              <span className="display" style={{ fontSize: 40, color: "var(--purple-400)" }}>{(p.name || "?")[0]}</span>
            </div>}
        {p.soldOut && (
          <span style={{ position: "absolute", top: 10, left: 10, fontFamily: "var(--font-mono)", fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 700, padding: "4px 9px", borderRadius: 999, background: "rgba(26,16,37,0.82)", color: "#fff" }}>Sold out</span>
        )}
      </div>
      <div style={{ padding: "12px 14px 14px" }}>
        <div className="display" style={{ fontSize: 16, color: "var(--ink)", lineHeight: 1.15 }}>{p.name}</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 6 }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: "var(--purple-600)" }}>{p.price}</span>
          {p.sizes && p.sizes.length > 1 && (
            <span style={{ fontSize: 10, fontFamily: "var(--font-ui)", letterSpacing: "0.04em", textTransform: "uppercase", color: "var(--ink-3)" }}>{p.sizes.length} sizes</span>
          )}
        </div>
      </div>
    </a>
  );
}

function MerchPage() {
  const { loading, products } = useProducts();
  const hasProducts = !loading && products.length > 0;
  return (
    <>
      <section style={{ padding: hasProducts ? "88px 0 40px" : "120px 0 160px", position: "relative", overflow: "hidden" }}>
        <PawS className="paw" style={{ top: 80, left: "8%", width: 56, height: 56, color: "#fff", opacity: 0.1 }} />
        <PawS className="paw" style={{ bottom: 60, right: "10%", width: 72, height: 72, color: "#fff", opacity: 0.1 }} />
        <div className="wrap" style={{ maxWidth: 720, margin: "0 auto", textAlign: "center", position: "relative", zIndex: 1 }}>
          {!hasProducts && (
            <div className="eyebrow" style={{ color: "var(--purple-400)", marginBottom: 16 }}><PawGlyphS />Coming Soon</div>
          )}
          <h1 className="display" style={{ fontSize: "clamp(48px, 7vw, 96px)", margin: "0 0 24px", color: "#fff", lineHeight: 0.98 }}>
            Wear the <em>cause.</em>
          </h1>
          <p style={{ fontSize: 18, color: "var(--on-dark-2)", maxWidth: 540, margin: "0 auto 36px", lineHeight: 1.55 }}>
            Tees, hoodies, totes, and more, designed to spark conversation and fund rescues from the East Asian dog meat trade. Every purchase puts dogs on planes home.
          </p>
          {!hasProducts && (
            <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
              <a href="/contact" className="btn btn-accent">Get Notified at Launch</a>
              <a href="/donate" className="btn btn-outline-light">Donate in the Meantime</a>
            </div>
          )}
        </div>
      </section>
      {hasProducts && (
        <section className="section-light" style={{ padding: "48px 0 72px" }}>
          <div className="wrap">
            {IS_PREVIEW && (
              <p style={{ textAlign: "center", margin: "0 0 24px", fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--purple-600)" }}>
                Preview mode — sample products, not live listings
              </p>
            )}
            <div className="ways-grid" style={{ display: "grid", gridTemplateColumns: `repeat(${Math.min(products.length, 4)}, 1fr)`, gap: 16, maxWidth: products.length < 4 ? products.length * 280 : "none", margin: "0 auto" }}>
              {products.map((p) => <ProductCard key={p.id} p={p} />)}
            </div>
            <p style={{ textAlign: "center", marginTop: 28, fontSize: 13, color: "var(--ink-3)" }}>
              Checkout is handled securely by Fourthwall. Every purchase funds rescue flights, medical care, and second chances.
            </p>
          </div>
        </section>
      )}
    </>
  );
}

function App() {
  useRevealS();
  return (
    <>
      <ScrollProgressS />
      <NavS active="merch" />
      <MerchPage />
      <FooterS />
    </>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
