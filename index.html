<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "palette": "plum",
    "hero": "centered",
    "paws": "on"
  }/*EDITMODE-END*/;
  window.__TWEAK_DEFAULTS__ = TWEAK_DEFAULTS;
</script>

<script type="text/babel" src="components.jsx?v=2"></script>
<script type="text/babel" src="help-illustrations.jsx?v=4"></script>
<script type="text/babel" src="sections.jsx?v=9"></script>
<script type="text/babel" src="interactions.jsx?v=5"></script>
<script type="text/babel" src="enhancements.jsx?v=5"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tweaks, setTweaks] = useState(window.__TWEAK_DEFAULTS__);
  const [modalOpen, setModalOpen] = useState(false);
  const [prefillName, setPrefillName] = useState(null);

  useEffect(() => {
    document.body.dataset.palette = tweaks.palette;
    document.body.dataset.paws = tweaks.paws;
  }, [tweaks]);

  useEffect(() => {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          e.target.classList.remove("pre");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -5% 0px" });
    const t = setTimeout(() => {
      const vh = window.innerHeight;
      document.querySelectorAll(".reveal").forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.top < vh * 0.9) el.classList.add("in");
        else { el.classList.add("pre"); io.observe(el); }
      });
    }, 80);
    return () => { clearTimeout(t); io.disconnect(); };
  }, []);

  const openSponsor = (name) => { setPrefillName(name || null); setModalOpen(true); };
  const openDonate = () => { setPrefillName(null); setModalOpen(true); };

  return (
    <>
      <ScrollProgress />
      <Nav onDonate={openDonate} />
      <Hero onDonate={openDonate} variant={tweaks.hero} />
      <LiveTicker />
      <Press />
      <Mission />
      <Survivors onSponsor={openSponsor} />
      <Ways onDonate={openDonate} onSponsor={openSponsor} />
      <RealityTeaser />
      <Journey />
      <Feature />
      <ImpactCalc onDonate={(amt) => openDonate()} />
      <Voices />
      <Testimonials />
      <Team />
      <FinalCTA onDonate={openDonate} />
      <Footer />
      <DonateModal open={modalOpen} prefillName={prefillName} onClose={() => setModalOpen(false)} />
      <Tweaks state={tweaks} onChange={setTweaks} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
