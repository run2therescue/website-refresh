<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "layout": "narrative",
    "paws": "on"
  }/*EDITMODE-END*/;
  window.__TWEAK_DEFAULTS__ = TWEAK_DEFAULTS;
</script>

<script type="text/babel" src="shared.jsx?v=15"></script>
<script type="text/babel" src="foster.jsx?v=8"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tweaks, setTweaks] = useState(window.__TWEAK_DEFAULTS__);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => {
    document.body.dataset.paws = tweaks.paws;
  }, [tweaks]);

  useEffect(() => {
    const onMsg = (ev) => {
      const d = ev.data || {};
      if (d.type === "__activate_edit_mode") setTweaksOpen(true);
      else if (d.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: patch }, "*");
  };

  useRevealS();

  return (
    <>
      <ScrollProgressS />
      <NavS active="foster" />
      <FosterHero variant={tweaks.layout} />
      <WhyFoster />
      <FosterJourney />
      <FosterTestimonial />
      <FosterForm />
      <FooterS />
      <TweaksPanel open={tweaksOpen} tweaks={tweaks} update={update} onClose={() => setTweaksOpen(false)} />
    </>
  );
}

function TweaksPanel({ open, tweaks, update, onClose }) {
  return (
    <aside className={`tweaks ${open ? "open" : ""}`}>
      <header>
        <span>Tweaks</span>
        <button onClick={onClose} style={{ color: "var(--ink-3)" }} aria-label="Close">✕</button>
      </header>
      <div className="row">
        <label>Layout</label>
        <div className="segmented">
          {[["narrative", "Narrative"], ["split", "Split + form"]].map(([v, l]) => (
            <button key={v} aria-pressed={tweaks.layout === v} onClick={() => update({ layout: v })}>{l}</button>
          ))}
        </div>
      </div>
      <div className="row">
        <label>Paw motifs</label>
        <div className="segmented">
          {[["on", "On"], ["off", "Off"]].map(([v, l]) => (
            <button key={v} aria-pressed={tweaks.paws === v} onClick={() => update({ paws: v })}>{l}</button>
          ))}
        </div>
      </div>
    </aside>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
