<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {"@type":"Question","name":"Why rescue dogs from China instead of American shelters?","acceptedAnswer":{"@type":"Answer","text":"Both matter. The dogs we bring home were not going to be adopted into a Chinese shelter, they were headed for the meat trade with no rescue infrastructure around them. Our partners on the ground get them out, our team brings them stateside, and we then match them with families ready to give a second chance. Many of our adopters have American shelter dogs at home already."}},
    {"@type":"Question","name":"Aren't these dogs too traumatized to be normal pets?","acceptedAnswer":{"@type":"Answer","text":"Most settle into normal pet life faster than people expect. The phrase we use is trauma to trust, not trauma to broken. We see the first real tail wag within the first week of foster, the first real play bow within the first month, and a dog who acts like he has lived in your house forever within three to six months. We are transparent about the dogs who need more time, and match those to experienced adopters."}},
    {"@type":"Question","name":"What medical care have they had before adoption?","acceptedAnswer":{"@type":"Answer","text":"Every Run 2 The Rescue dog arrives spayed or neutered, fully vaccinated (DHPP, rabies, bordetella), microchipped, dewormed, and tested for the diseases that matter for international transport including heartworm, distemper, parvo, and tick-borne illnesses. Anything chronic is treated or stabilized before they are listed for adoption."}},
    {"@type":"Question","name":"How are Run 2 The Rescue dogs with kids, other dogs, and cats?","acceptedAnswer":{"@type":"Answer","text":"It depends on the dog, and we tell you exactly what we know. Every dog profile is honest about who they have been observed with in foster: kids, other dogs, cats, men, women, leashes, stairs, car rides. If a dog is still working through a fear, we say so and match accordingly."}},
    {"@type":"Question","name":"What support do I get after I bring them home?","acceptedAnswer":{"@type":"Answer","text":"Lifetime support. A dedicated coordinator answers texts and emails for as long as you have the dog. Our trainer network gives discounted intro sessions to every R2TR adopter. If life ever changes and you cannot keep them, the adoption contract requires the dog comes back to us, never to a shelter."}},
    {"@type":"Question","name":"How long until a rescued dog feels like a normal dog at home?","acceptedAnswer":{"@type":"Answer","text":"The three-three-three rule is a useful sketch: three days to decompress, three weeks to learn your routine, three months to feel fully at home. Some dogs are couch surfing by day two, others quietly observe for a month and then bloom. Both are normal."}}
  ]
}

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "hero": "filter",
    "paws": "on"
  }/*EDITMODE-END*/;
  window.__TWEAK_DEFAULTS__ = TWEAK_DEFAULTS;
</script>

<script type="text/babel" src="shared.jsx?v=19"></script>
<script type="text/babel" src="dog-illustration.jsx"></script>
<script type="text/babel" src="adopt.jsx?v=19"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tweaks, setTweaks] = useState(window.__TWEAK_DEFAULTS__);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => {
    document.body.dataset.paws = tweaks.paws;
  }, [tweaks]);

  useEffect(() => {
    const onMsg = (ev) => {
      const d = ev.data || {};
      if (d.type === "__activate_edit_mode") setTweaksOpen(true);
      else if (d.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: patch }, "*");
  };

  useRevealS();

  return (
    <>
      <ScrollProgressS />
      <NavS active="adopt" />
      <AdoptHero variant={tweaks.hero} />
      <DifferentDogsS />
      <AdoptDirectory />
      <AdoptProcess />
      <AdoptFAQ />
      <AdoptCTA />
      <FooterS />
      <TweaksPanel open={tweaksOpen} tweaks={tweaks} update={update} onClose={() => setTweaksOpen(false)} />
    </>
  );
}

function TweaksPanel({ open, tweaks, update, onClose }) {
  return (
    <aside className={`tweaks ${open ? "open" : ""}`}>
      <header>
        <span>Tweaks</span>
        <button onClick={onClose} style={{ color: "var(--ink-3)" }} aria-label="Close">✕</button>
      </header>
      <div className="row">
        <label>Hero style</label>
        <div className="segmented">
          {[["filter", "Filter-led"], ["editorial", "Editorial"]].map(([v, l]) => (
            <button key={v} aria-pressed={tweaks.hero === v} onClick={() => update({ hero: v })}>{l}</button>
          ))}
        </div>
      </div>
      <div className="row">
        <label>Paw motifs</label>
        <div className="segmented">
          {[["on", "On"], ["off", "Off"]].map(([v, l]) => (
            <button key={v} aria-pressed={tweaks.paws === v} onClick={() => update({ paws: v })}>{l}</button>
          ))}
        </div>
      </div>
    </aside>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
