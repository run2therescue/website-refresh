<title>Adopt — Run 2 The Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body data-palette="plum">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "hero": "filter",
    "paws": "on"
  }/*EDITMODE-END*/;
  window.__TWEAK_DEFAULTS__ = TWEAK_DEFAULTS;
</script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="dog-illustration.jsx"></script>
<script type="text/babel" src="adopt.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tweaks, setTweaks] = useState(window.__TWEAK_DEFAULTS__);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => {
    document.body.dataset.paws = tweaks.paws;
  }, [tweaks]);

  useEffect(() => {
    const onMsg = (ev) => {
      const d = ev.data || {};
      if (d.type === "__activate_edit_mode") setTweaksOpen(true);
      else if (d.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: patch }, "*");
  };

  useRevealS();

  return (
    <>
      <ScrollProgressS />
      <NavS active="adopt" />
      <AdoptHero variant={tweaks.hero} />
      <AdoptDirectory />
      <AdoptProcess />
      <AdoptCTA />
      <FooterS />
      <TweaksPanel open={tweaksOpen} tweaks={tweaks} update={update} onClose={() => setTweaksOpen(false)} />
    </>
  );
}

function TweaksPanel({ open, tweaks, update, onClose }) {
  return (
    <aside className={`tweaks ${open ? "open" : ""}`}>
      <header>
        <span>Tweaks</span>
        <button onClick={onClose} style={{ color: "var(--ink-3)" }} aria-label="Close">✕</button>
      </header>
      <div className="row">
        <label>Hero style</label>
        <div className="segmented">
          {[["filter", "Filter-led"], ["editorial", "Editorial"]].map(([v, l]) => (
            <button key={v} aria-pressed={tweaks.hero === v} onClick={() => update({ hero: v })}>{l}</button>
          ))}
        </div>
      </div>
      <div className="row">
        <label>Paw motifs</label>
        <div className="segmented">
          {[["on", "On"], ["off", "Off"]].map(([v, l]) => (
            <button key={v} aria-pressed={tweaks.paws === v} onClick={() => update({ paws: v })}>{l}</button>
          ))}
        </div>
      </div>
    </aside>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script defer src="feedback.js"></script>
</body>
</html>
