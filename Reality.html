<script type="text/babel">
function App() {
  const [revealed, setRevealed] = React.useState(false);
  const [warnOpen, setWarnOpen] = React.useState(true);
  useRevealS();
  return (
    <>
      <ScrollProgressS />
      <NavS active="home" />
      <RealityHero revealed={revealed} />
      <RealityIntro revealed={revealed} onReveal={() => setRevealed(true)} />
      <RealityGallery revealed={revealed} />
      <RealityClips revealed={revealed} />
      <RealityCTA />
      <FooterS />
      <TriggerWarning
        open={warnOpen}
        onAccept={() => { setRevealed(true); setWarnOpen(false); }}
        onDecline={() => setWarnOpen(false)}
      />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
